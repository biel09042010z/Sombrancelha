<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — "Seu Nome"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3F1;
    --paper-2:#F3DDD6;
    --ink:#3B2A26;
    --ink-soft:#8C6E67;
    --line:#C1694F;
    --line-soft:#E3B7A8;
    --card:#FFFFFF;
    --danger:#B4483A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper-2);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    width:100%;
    padding-bottom:96px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  button,a.btn{font-family:'Inter',sans-serif;cursor:pointer;}
  :focus-visible{outline:2px solid var(--line);outline-offset:2px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;width:100%;}

  /* LOGIN */
  .login-screen{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .login-box{
    background:var(--card);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:40px 32px;
    width:100%;max-width:380px;
  }
  .login-box .logo{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:1.2rem;
    margin-bottom:28px;
    display:flex;align-items:center;gap:8px;
  }
  .login-box h2{font-size:1.4rem;margin-bottom:6px;}
  .login-box p{color:var(--ink-soft);font-size:0.9rem;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.82rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;
    border:1px solid var(--line-soft);border-radius:6px;
    font-family:'Inter',sans-serif;font-size:0.95rem;
    background:var(--paper);color:var(--ink);
    transition:border-color .2s;
  }
  .field input:focus{outline:none;border-color:var(--line);}
  .btn-login{
    width:100%;padding:13px;
    background:var(--ink);color:var(--paper);
    border:0;border-radius:6px;
    font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:600;
    cursor:pointer;transition:background .2s;margin-top:8px;
  }
  .btn-login:hover{background:var(--line);}
  .login-error{
    background:#FBEFEC;border:1px solid #EBD3CE;
    color:var(--danger);
    padding:10px 14px;border-radius:6px;
    font-size:0.88rem;margin-top:14px;
    display:none;
  }

  /* TOPBAR */
  .topbar{
    background:var(--card);
    border-bottom:1px solid var(--line-soft);
    padding:20px 0;
    position:sticky;top:0;z-index:10;
  }
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar h1{font-size:1.5rem;}
  .topbar-actions{display:flex;gap:10px;}
  .btn-outline{
    background:var(--card);border:1px solid var(--line-soft);
    color:var(--ink);padding:10px 18px;border-radius:6px;
    font-size:0.88rem;font-weight:500;white-space:nowrap;
    text-decoration:none;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-outline:hover{border-color:var(--line);}

  /* PANEL */
  .panel-section{padding:32px 0 8px;}
  .panel-section h2{font-size:1.3rem;margin-bottom:20px;}
  .card-list{display:flex;flex-direction:column;gap:16px;width:100%;}
  .item-card{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;width:100%;}
  .item-thumb{width:100%;aspect-ratio:16/9;background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--line-soft);position:relative;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;}
  .item-thumb svg{width:34px;height:34px;}
  .item-thumb .loading-overlay{
    position:absolute;inset:0;
    background:rgba(251,243,241,0.85);
    display:flex;align-items:center;justify-content:center;
    font-size:0.88rem;color:var(--ink-soft);font-weight:500;
  }
  .item-body{padding:16px 18px 18px;}
  .item-body h3{font-size:1.05rem;margin-bottom:12px;}
  .item-actions{display:flex;gap:10px;}
  .btn-add,.btn-remove{
    flex:1;padding:11px 0;border-radius:6px;
    font-size:0.9rem;font-weight:600;
    border:1px solid var(--line-soft);
    background:var(--card);text-align:center;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-add{color:var(--line);border-color:var(--line-soft);}
  .btn-add:hover{background:var(--paper-2);}
  .btn-remove{color:var(--danger);border-color:#EBD3CE;}
  .btn-remove:hover{background:#FBEFEC;}
  .btn-add:disabled,.btn-remove:disabled{opacity:0.5;cursor:not-allowed;}
  input[type="file"]{display:none;}

  /* SAVEBAR */
  .savebar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--ink);padding:14px 0;
  }
  .savebar .wrap{display:flex;justify-content:flex-end;}
  .btn-save{
    background:var(--card);color:var(--ink);border:0;
    padding:13px 26px;border-radius:6px;
    font-size:0.95rem;font-weight:700;
    display:inline-flex;align-items:center;gap:8px;
    cursor:pointer;font-family:'Inter',sans-serif;
  }
  .btn-save:hover{background:var(--paper-2);}
  .btn-save svg{width:16px;height:16px;stroke:var(--line);stroke-width:2.4;fill:none;}

  /* TOAST */
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);
    background:var(--ink);color:var(--paper);
    padding:12px 20px;border-radius:6px;
    font-size:0.88rem;font-weight:500;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
    z-index:30;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:480px){
    .topbar h1{font-size:1.25rem;}
    .btn-outline{padding:9px 14px;font-size:0.82rem;}
    .login-box{padding:32px 20px;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 15 Q 8 5, 12 8 T 22 9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      "Seu Nome"
    </div>
    <h2>Entrar no painel</h2>
    <p>Acesso restrito à administradora.</p>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- PAINEL -->
<div id="painel-screen" style="display:none;">
  <header class="topbar">
    <div class="wrap">
      <h1>Painel</h1>
      <div class="topbar-actions">
        <button class="btn-outline" onclick="sair()">Sair</button>
        <a class="btn-outline" href="traco-studio.html">Fechar</a>
      </div>
    </div>
  </header>

  <main>
    <section class="panel-section wrap">
      <h2>Fotos da galeria</h2>
      <div class="card-list" id="galeria-list"></div>
    </section>
    <section class="panel-section wrap">
      <h2>Fotos dos serviços</h2>
      <div class="card-list" id="servicos-list"></div>
    </section>
  </main>

  <footer class="savebar">
    <div class="wrap">
      <button class="btn-save" onclick="mostrarToast('Tudo salvo automaticamente.')">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        Salvo automaticamente
      </button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPA_URL = 'https://bndrhdclhnldihumljaw.supabase.co';
  const SUPA_KEY = 'sb_publishable_UXQStr_CoRbcdItbIAmTIw_9wBuJCNY';
  const BUCKET  = 'fotos-studio';
  const CATEGORIAS = ['Sobrancelha', 'Cílios', 'Maquiagem'];

  const iconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>`;

  let session = null;

  // ── AUTH ──────────────────────────────────────────────
  async function fazerLogin() {
    const email = document.getElementById('email').value.trim();
    const senha = document.getElementById('senha').value;
    const errEl = document.getElementById('login-error');
    const btn   = document.getElementById('btn-login');

    errEl.style.display = 'none';
    btn.textContent = 'Entrando…';
    btn.disabled = true;

    try {
      const res = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPA_KEY },
        body: JSON.stringify({ email, password: senha })
      });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error_description || data.msg || 'Credenciais inválidas.');

      session = data;
      mostrarPainel();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    } finally {
      btn.textContent = 'Entrar';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none') {
      fazerLogin();
    }
  });

  async function sair() {
    if (session?.access_token) {
      await fetch(`${SUPA_URL}/auth/v1/logout`, {
        method: 'POST',
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${session.access_token}` }
      }).catch(() => {});
    }
    session = null;
    document.getElementById('painel-screen').style.display = 'none';
    document.getElementById('login-screen').style.display  = 'flex';
  }

  // ── PAINEL ────────────────────────────────────────────
  async function mostrarPainel() {
    document.getElementById('login-screen').style.display  = 'none';
    document.getElementById('painel-screen').style.display = 'block';
    await carregarFotos();
  }

  async function carregarFotos() {
    const res  = await fetch(`${SUPA_URL}/rest/v1/fotos?select=*`, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${session.access_token}` }
    });
    const rows = await res.json();

    buildList('galeria-list',  'gal',  'galeria',  rows);
    buildList('servicos-list', 'serv', 'servicos', rows);
  }

  function buildList(containerId, prefix, secao, rows) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';

    CATEGORIAS.forEach((nome, i) => {
      const id   = `${prefix}-${i}`;
      const foto = rows.find(r => r.secao === secao && r.categoria === nome);

      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `
        <div class="item-thumb" id="thumb-${id}">
          ${foto ? `<img src="${foto.public_url}" alt="${nome}">` : iconSvg}
        </div>
        <div class="item-body">
          <h3>${nome}</h3>
          <div class="item-actions">
            <label class="btn-add" for="file-${id}" id="label-${id}">Adicionar foto</label>
            <input type="file" accept="image/*" id="file-${id}"
              onchange="uploadFoto('${id}','${secao}','${nome}',this)">
            <button class="btn-remove" onclick="deletarFoto('${id}','${secao}','${nome}')">Excluir</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // ── UPLOAD ────────────────────────────────────────────
  async function uploadFoto(id, secao, categoria, input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    const ext  = file.name.split('.').pop();
    const path = `${secao}/${categoria.replace(/\s/g,'_')}_${Date.now()}.${ext}`;

    setLoading(id, true);

    try {
      // 1. Upload para Storage
      const upRes = await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`, {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': file.type
        },
        body: file
      });
      if (!upRes.ok) throw new Error('Falha no upload da imagem.');

      const publicUrl = `${SUPA_URL}/storage/v1/object/public/${BUCKET}/${path}`;

      // 2. Apaga registro antigo se existir
      await fetch(`${SUPA_URL}/rest/v1/fotos?secao=eq.${secao}&categoria=eq.${encodeURIComponent(categoria)}`, {
        method: 'DELETE',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': 'application/json'
        }
      });

      // 3. Insere novo registro
      const insRes = await fetch(`${SUPA_URL}/rest/v1/fotos`, {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${session.access_token}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ secao, categoria, storage_path: path, public_url: publicUrl })
      });
      if (!insRes.ok) throw new Error('Falha ao salvar no banco.');

      // 4. Atualiza thumb
      document.getElementById(`thumb-${id}`).innerHTML = `<img src="${publicUrl}" alt="${categoria}">`;
      mostrarToast('Foto salva com sucesso!');

    } catch (err) {
      mostrarToast('Erro: ' + err.message);
    } finally {
      setLoading(id, false);
      input.value = '';
    }
  }

  // ── DELETE ────────────────────────────────────────────
  async function deletarFoto(id, secao, categoria) {
    setLoading(id, true);
    try {
      // Busca o path atual
      const res  = await fetch(`${SUPA_URL}/rest/v1/fotos?secao=eq.${secao}&categoria=eq.${encodeURIComponent(categoria)}&select=storage_path`, {
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${session.access_token}` }
      });
      const rows = await res.json();
      if (!rows.length) { mostrarToast('Nenhuma foto para excluir.'); return; }

      const storagePath = rows[0].storage_path;

      // Remove do Storage
      await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${storagePath}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${session.access_token}` }
      });

      // Remove do banco
      await fetch(`${SUPA_URL}/rest/v1/fotos?secao=eq.${secao}&categoria=eq.${encodeURIComponent(categoria)}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${session.access_token}` }
      });

      document.getElementById(`thumb-${id}`).innerHTML = iconSvg;
      mostrarToast('Foto excluída.');
    } catch (err) {
      mostrarToast('Erro: ' + err.message);
    } finally {
      setLoading(id, false);
    }
  }

  // ── HELPERS ───────────────────────────────────────────
  function setLoading(id, on) {
    const thumb = document.getElementById(`thumb-${id}`);
    const label = document.getElementById(`label-${id}`);
    if (on) {
      const ov = document.createElement('div');
      ov.className = 'loading-overlay';
      ov.id = `loading-${id}`;
      ov.textContent = 'Aguarde…';
      thumb.appendChild(ov);
      if (label) label.style.pointerEvents = 'none';
    } else {
      const ov = document.getElementById(`loading-${id}`);
      if (ov) ov.remove();
      if (label) label.style.pointerEvents = '';
    }
  }

  function mostrarToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }
</script>
</body>
</html>
