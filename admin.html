<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — "Seu Nome"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF3F1;--paper-2:#F3DDD6;--ink:#3B2A26;--ink-soft:#8C6E67;
    --line:#C1694F;--line-soft:#E3B7A8;--card:#FFFFFF;--danger:#B4483A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper-2);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;width:100%;padding-bottom:96px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  :focus-visible{outline:2px solid var(--line);outline-offset:2px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 20px;width:100%;}

  /* LOGIN */
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:40px 32px;width:100%;max-width:380px;}
  .login-box .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.2rem;margin-bottom:28px;display:flex;align-items:center;gap:8px;}
  .login-box h2{font-size:1.4rem;margin-bottom:6px;}
  .login-box p{color:var(--ink-soft);font-size:0.9rem;margin-bottom:28px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.82rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .field input{width:100%;padding:12px 14px;border:1px solid var(--line-soft);border-radius:6px;font-family:'Inter',sans-serif;font-size:0.95rem;background:var(--paper);color:var(--ink);transition:border-color .2s;}
  .field input:focus{outline:none;border-color:var(--line);}
  .btn-login{width:100%;padding:13px;background:var(--ink);color:var(--paper);border:0;border-radius:6px;font-family:'Inter',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:background .2s;margin-top:8px;}
  .btn-login:hover{background:var(--line);}
  .login-error{background:#FBEFEC;border:1px solid #EBD3CE;color:var(--danger);padding:10px 14px;border-radius:6px;font-size:0.88rem;margin-top:14px;display:none;}

  /* TOPBAR */
  .topbar{background:var(--card);border-bottom:1px solid var(--line-soft);padding:20px 0;position:sticky;top:0;z-index:10;}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .topbar h1{font-size:1.5rem;}
  .topbar-actions{display:flex;gap:10px;}
  .btn-outline{background:var(--card);border:1px solid var(--line-soft);color:var(--ink);padding:10px 18px;border-radius:6px;font-size:0.88rem;font-weight:500;white-space:nowrap;text-decoration:none;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-outline:hover{border-color:var(--line);}

  /* PANEL */
  .panel-section{padding:32px 0 8px;}
  .panel-section>h2{font-size:1.3rem;margin-bottom:6px;}
  .panel-section .section-desc{font-size:0.85rem;color:var(--ink-soft);margin-bottom:20px;}
  .card-list{display:flex;flex-direction:column;gap:20px;width:100%;}

  /* CATEGORY CARD */
  .cat-card{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;transition:opacity .2s;}
  .cat-card.oculto{opacity:.55;}
  .cat-card-header{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .cat-card-header h3{font-size:1rem;margin:0;}
  .cat-card-header .header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;}

  /* BADGE oculto */
  .badge-oculto{font-size:0.72rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:var(--paper-2);color:var(--ink-soft);padding:3px 8px;border-radius:20px;display:none;}
  .cat-card.oculto .badge-oculto{display:inline-block;}

  /* BTN OCULTAR */
  .btn-toggle-vis{
    border:1px solid var(--line-soft);background:var(--paper);color:var(--ink-soft);
    padding:6px 12px;border-radius:6px;font-size:0.78rem;font-weight:600;
    display:flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .btn-toggle-vis:hover{border-color:var(--ink);color:var(--ink);}
  .btn-toggle-vis svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;}
  .cat-card.oculto .btn-toggle-vis{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .cat-card.oculto .btn-toggle-vis:hover{background:var(--line);border-color:var(--line);}

  .cat-card-body{padding:14px 18px 18px;}
  .cat-card.oculto .cat-card-body{pointer-events:none;}

  /* FOTO GRID */
  .fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .foto-slot{position:relative;aspect-ratio:1/1;background:var(--paper-2);border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--line-soft);}
  .foto-slot img{width:100%;height:100%;object-fit:cover;}
  .foto-slot svg{width:24px;height:24px;}
  .foto-slot .slot-num{position:absolute;top:5px;left:7px;font-size:0.68rem;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,0.8);padding:1px 5px;border-radius:3px;}

  /* BOTÃO REMOVER — sempre visível no mobile, hover no desktop */
  .foto-slot .del-btn{
    position:absolute;bottom:5px;right:5px;
    background:var(--danger);border:0;border-radius:5px;
    color:#fff;font-size:0.7rem;font-weight:700;
    padding:4px 8px;cursor:pointer;
    display:flex;align-items:center;gap:4px;
    font-family:'Inter',sans-serif;
    opacity:0;transition:opacity .15s;
  }
  .foto-slot:hover .del-btn,
  .foto-slot .del-btn:focus{ opacity:1; }
  /* mobile: sempre visível */
  @media(hover:none){ .foto-slot .del-btn{opacity:1;} }
  .foto-slot .del-btn svg{width:11px;height:11px;stroke:#fff;stroke-width:2.5;fill:none;}

  .foto-slot .loading-ov{position:absolute;inset:0;background:rgba(251,243,241,0.9);display:flex;align-items:center;justify-content:center;font-size:0.8rem;color:var(--ink-soft);font-weight:500;}

  .btn-add-foto{
    width:100%;padding:11px;border-radius:6px;font-size:0.9rem;font-weight:600;
    border:1px dashed var(--line-soft);background:var(--paper);color:var(--line);
    cursor:pointer;font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .2s,border-color .2s;
  }
  .btn-add-foto:hover{background:var(--paper-2);border-color:var(--line);}
  .btn-add-foto svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;}
  input[type="file"]{display:none;}

  /* SAVEBAR */
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);padding:14px 0;}
  .savebar .wrap{display:flex;justify-content:flex-end;}
  .btn-save{background:var(--card);color:var(--ink);border:0;padding:13px 26px;border-radius:6px;font-size:0.95rem;font-weight:700;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-save svg{width:16px;height:16px;stroke:var(--line);stroke-width:2.4;fill:none;}

  /* TOAST */
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:6px;font-size:0.88rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:30;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(max-width:480px){
    .topbar h1{font-size:1.2rem;}
    .btn-outline{padding:9px 12px;font-size:0.82rem;}
    .login-box{padding:32px 20px;}
    .fotos-grid{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M2 15 Q 8 5, 12 8 T 22 9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      "Seu Nome"
    </div>
    <h2>Entrar no painel</h2>
    <p>Acesso restrito à administradora.</p>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- PAINEL -->
<div id="painel-screen" style="display:none;">
  <header class="topbar">
    <div class="wrap">
      <h1>Painel</h1>
      <div class="topbar-actions">
        <button class="btn-outline" onclick="sair()">Sair</button>
        <a class="btn-outline" href="traco-studio.html">Fechar</a>
      </div>
    </div>
  </header>

  <main>
    <section class="panel-section wrap">
      <h2>Fotos da galeria</h2>
      <p class="section-desc">Até 9 fotos por categoria — aparecem na galeria do site.</p>
      <div class="card-list" id="galeria-list"></div>
    </section>
    <section class="panel-section wrap">
      <h2>Fotos dos serviços</h2>
      <p class="section-desc">Imagem de fundo de cada card de serviço.</p>
      <div class="card-list" id="servicos-list"></div>
    </section>
  </main>

  <footer class="savebar">
    <div class="wrap">
      <button class="btn-save">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        Salvo automaticamente
      </button>
    </div>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPA_URL     = 'https://bndrhdclhnldihumljaw.supabase.co';
  const SUPA_KEY     = 'sb_publishable_UXQStr_CoRbcdItbIAmTIw_9wBuJCNY';
  const BUCKET       = 'fotos-studio';
  const CATS         = ['Sobrancelha', 'Cílios', 'Maquiagem'];
  const MAX_GALERIA  = 9;
  const MAX_SERVICOS = 1;

  const iconSvg  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10.5" r="1.5"/><path d="m21 15-5-5L5 19"/></svg>`;
  const plusSvg  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
  const trashSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>`;
  const eyeSvg   = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const eyeOffSvg= `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

  let session = null;
  let configCache = {}; // { 'galeria|Sobrancelha': {id, oculto}, ... }

  // ── SESSION ───────────────────────────────────────────
  function salvarSessao(s){ try{localStorage.setItem('admin_session',JSON.stringify(s));}catch(e){} }
  function carregarSessaoLocal(){
    try{
      const raw=localStorage.getItem('admin_session');
      if(!raw) return null;
      const s=JSON.parse(raw);
      if(s.expires_at && Date.now()/1000 > s.expires_at){ localStorage.removeItem('admin_session'); return null; }
      return s;
    }catch(e){return null;}
  }
  function limparSessao(){ try{localStorage.removeItem('admin_session');}catch(e){} }

  window.addEventListener('DOMContentLoaded',()=>{
    const s=carregarSessaoLocal();
    if(s){session=s;mostrarPainel();}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Enter' && document.getElementById('login-screen').style.display!=='none') fazerLogin();
  });

  // ── AUTH ──────────────────────────────────────────────
  async function fazerLogin(){
    const email=document.getElementById('email').value.trim();
    const senha=document.getElementById('senha').value;
    const errEl=document.getElementById('login-error');
    const btn=document.getElementById('btn-login');
    errEl.style.display='none'; btn.textContent='Entrando…'; btn.disabled=true;
    try{
      const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{
        method:'POST',
        headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
        body:JSON.stringify({email,password:senha})
      });
      const data=await res.json();
      if(!res.ok) throw new Error(data.error_description||data.msg||'Credenciais inválidas.');
      session=data; salvarSessao(session); mostrarPainel();
    }catch(err){
      errEl.textContent=err.message; errEl.style.display='block';
    }finally{
      btn.textContent='Entrar'; btn.disabled=false;
    }
  }

  async function sair(){
    if(session?.access_token){
      await fetch(`${SUPA_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`}}).catch(()=>{});
    }
    limparSessao(); session=null;
    document.getElementById('painel-screen').style.display='none';
    document.getElementById('login-screen').style.display='flex';
  }

  // ── PAINEL ────────────────────────────────────────────
  async function mostrarPainel(){
    document.getElementById('login-screen').style.display='none';
    document.getElementById('painel-screen').style.display='block';
    await carregarFotos();
  }

  async function carregarFotos(){
    const [resF, resC] = await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/fotos?select=*&order=indice.asc`,{
        headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`}
      }),
      fetch(`${SUPA_URL}/rest/v1/categorias_config?select=*`,{
        headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`}
      })
    ]);
    const rows   = await resF.json();
    const configs= await resC.json();

    // monta cache de config
    configCache = {};
    configs.forEach(c=>{ configCache[`${c.secao}|${c.categoria}`]=c; });

    buildSection('galeria-list',  'gal',  'galeria',  rows, MAX_GALERIA);
    buildSection('servicos-list', 'serv', 'servicos', rows, MAX_SERVICOS);
  }

  function buildSection(containerId, prefix, secao, rows, maxFotos){
    const container=document.getElementById(containerId);
    container.innerHTML='';

    CATS.forEach((cat,ci)=>{
      const key   = `${secao}|${cat}`;
      const cfg   = configCache[key];
      const oculto= cfg?.oculto || false;
      const fotos = rows.filter(r=>r.secao===secao && r.categoria===cat).sort((a,b)=>a.indice-b.indice);
      const fileId= `file-${prefix}-${ci}`;

      const card=document.createElement('div');
      card.className='cat-card'+(oculto?' oculto':'');
      card.id=`card-${prefix}-${ci}`;

      let slotsHtml='<div class="fotos-grid" id="grid-'+prefix+'-'+ci+'">';
      fotos.forEach((f,fi)=>{ slotsHtml+=slotHtml(prefix,ci,fi,f.public_url,f.id); });
      // placeholders visuais (até 3)
      const nPlaceholders=Math.min(3, Math.max(0, Math.min(3,maxFotos)-fotos.length));
      for(let v=0;v<nPlaceholders && fotos.length<maxFotos;v++){
        slotsHtml+=`<div class="foto-slot">${iconSvg}</div>`;
      }
      slotsHtml+='</div>';

      const podeAdicionar=fotos.length<maxFotos;
      const btnVis=`
        <button class="btn-toggle-vis" onclick="toggleVisibilidade('${secao}','${cat}','${prefix}','${ci}')">
          ${oculto ? eyeSvg+'Mostrar' : eyeOffSvg+'Ocultar'}
        </button>`;

      card.innerHTML=`
        <div class="cat-card-header">
          <div style="display:flex;align-items:center;gap:8px;">
            <h3>${cat}</h3>
            <span class="badge-oculto">Oculto</span>
          </div>
          <div class="header-actions">${btnVis}</div>
        </div>
        <div class="cat-card-body">
          ${slotsHtml}
          ${podeAdicionar ? `
            <label class="btn-add-foto" for="${fileId}">${plusSvg} Adicionar foto</label>
            <input type="file" accept="image/*" id="${fileId}"
              onchange="uploadFoto('${prefix}','${ci}','${secao}','${cat}',${fotos.length},this)">
          ` : `<p style="font-size:0.82rem;color:var(--ink-soft);text-align:center;padding-top:4px;">Limite de ${maxFotos} foto${maxFotos>1?'s':''} atingido</p>`}
        </div>`;
      container.appendChild(card);
    });
  }

  function slotHtml(prefix,ci,fi,url,dbId){
    return `
      <div class="foto-slot" id="slot-${prefix}-${ci}-${fi}">
        <img src="${url}" alt="" loading="lazy">
        <span class="slot-num">${fi+1}</span>
        <button class="del-btn" onclick="deletarFoto('${dbId}','${prefix}','${ci}','${fi}')" title="Remover foto">
          ${trashSvg} Remover
        </button>
      </div>`;
  }

  // ── VISIBILIDADE ──────────────────────────────────────
  async function toggleVisibilidade(secao, categoria, prefix, ci){
    const key    = `${secao}|${categoria}`;
    const cfg    = configCache[key];
    const novoVal= !(cfg?.oculto || false);

    try{
      if(cfg?.id){
        // atualiza
        await fetch(`${SUPA_URL}/rest/v1/categorias_config?id=eq.${cfg.id}`,{
          method:'PATCH',
          headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json','Prefer':'return=minimal'},
          body:JSON.stringify({oculto:novoVal})
        });
      } else {
        // insere
        const res=await fetch(`${SUPA_URL}/rest/v1/categorias_config`,{
          method:'POST',
          headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json','Prefer':'return=representation'},
          body:JSON.stringify({secao,categoria,oculto:novoVal})
        });
        const [novo]=await res.json();
        configCache[key]={...novo};
      }
      configCache[key]={...(configCache[key]||{}), oculto:novoVal, secao, categoria};
      mostrarToast(novoVal ? `"${categoria}" ocultado no site.` : `"${categoria}" visível no site.`);
      await carregarFotos();
    }catch(err){
      mostrarToast('Erro: '+err.message);
    }
  }

  // ── UPLOAD ────────────────────────────────────────────
  async function uploadFoto(prefix,ci,secao,categoria,indice,input){
    if(!input.files||!input.files[0]) return;
    const file=input.files[0];
    const ext=file.name.split('.').pop();
    const path=`${secao}/${categoria.replace(/\s/g,'_')}_${Date.now()}.${ext}`;
    const grid=document.getElementById(`grid-${prefix}-${ci}`);

    const tmpSlot=document.createElement('div');
    tmpSlot.className='foto-slot';
    tmpSlot.innerHTML=`<div class="loading-ov">Enviando…</div>`;
    grid.appendChild(tmpSlot);

    try{
      const upRes=await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`,{
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`,'Content-Type':file.type},
        body:file
      });
      if(!upRes.ok) throw new Error('Falha no upload.');
      const publicUrl=`${SUPA_URL}/storage/v1/object/public/${BUCKET}/${path}`;

      const insRes=await fetch(`${SUPA_URL}/rest/v1/fotos`,{
        method:'POST',
        headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`,'Content-Type':'application/json','Prefer':'return=representation'},
        body:JSON.stringify({secao,categoria,storage_path:path,public_url:publicUrl,indice})
      });
      if(!insRes.ok) throw new Error('Falha ao salvar no banco.');
      mostrarToast('Foto adicionada!');
      await carregarFotos();
    }catch(err){
      tmpSlot.remove();
      mostrarToast('Erro: '+err.message);
    }finally{
      input.value='';
    }
  }

  // ── DELETE ────────────────────────────────────────────
  async function deletarFoto(dbId,prefix,ci,fi){
    const slot=document.getElementById(`slot-${prefix}-${ci}-${fi}`);
    if(slot) slot.innerHTML=`<div class="loading-ov">Removendo…</div>`;
    try{
      const res=await fetch(`${SUPA_URL}/rest/v1/fotos?id=eq.${dbId}&select=storage_path`,{
        headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`}
      });
      const rows=await res.json();
      if(rows.length&&rows[0].storage_path){
        await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${rows[0].storage_path}`,{
          method:'DELETE',
          headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`}
        });
      }
      await fetch(`${SUPA_URL}/rest/v1/fotos?id=eq.${dbId}`,{
        method:'DELETE',
        headers:{'apikey':SUPA_KEY,'Authorization':`Bearer ${session.access_token}`}
      });
      mostrarToast('Foto removida.');
      await carregarFotos();
    }catch(err){
      mostrarToast('Erro: '+err.message);
      await carregarFotos();
    }
  }

  // ── TOAST ─────────────────────────────────────────────
  function mostrarToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2800);
  }
</script>
</body>
</html>
